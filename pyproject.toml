[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inventorypulse"
version = "0.3.0"
description = "Auditable inventory excess and obsolescence operations analyst"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
fabric = ["mcp>=1.20,<2", "azure-identity>=1.20,<2"]
ollama = ["agent-framework-core==1.24.0", "httpx>=0.28,<1"]
agentic = ["agent-framework-core==1.24.0", "agent-framework-openai==1.18.0", "mcp>=1.20,<2", "azure-identity>=1.20,<2"]

[project.scripts]
inventorypulse = "inventorypulse.cli:main"

[tool.setuptools.package-data]
inventorypulse = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
include = ["inventorypulse*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
